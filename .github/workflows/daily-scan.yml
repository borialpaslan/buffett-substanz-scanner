name: Täglicher Buffett Substanz-Scan (08:00 Uhr)

on:
  schedule:
    - cron: '0 6 * * *' # Täglich um 08:00 Uhr MESZ (06:00 UTC)
  workflow_dispatch: # Erlaubt auch manuellen Start im GitHub-Tab "Actions"

permissions:
  contents: write

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Täglichen Bilanz- & Substanz-Scan ausführen (DAX 40, BIST 30, S&P 500)
        run: npm run scan

      - name: Aktualisierte Tages-Daten committen & pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest-scan.json
          git diff --staged --quiet || git commit -m "chore: Täglicher Buffett Substanz-Scan $(date -u +'%Y-%m-%d')"
          git push
